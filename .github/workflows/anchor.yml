name: Anchor Program

on:
  push:
    branches: [main, beta, mini-test]
  pull_request:
    branches: [main, beta]
    paths:
      - "programs/**"
      - "tests/**"
      - "shared/**"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/anchor.yml"

permissions:
  contents: read

jobs:
  anchor-build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: metadaoproject/setup-anchor@v3.3
        with:
          anchor-version: "0.30.1"
          solana-cli-version: "1.18.26"
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate local Solana keypair
        shell: bash
        run: |
          export PATH="$HOME/solana-release/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          command -v solana-keygen
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json

      - name: Install Anchor IDL compatibility toolchain
        run: rustup toolchain install nightly-2025-04-01 --profile minimal --no-self-update

      - name: Anchor build
        env:
          RUSTUP_TOOLCHAIN: nightly-2025-04-01
        run: anchor build

      - name: Anchor test
        env:
          RUSTUP_TOOLCHAIN: nightly-2025-04-01
        run: anchor test --skip-lint
