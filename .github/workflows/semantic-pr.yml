name: Semantic PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, beta]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-title:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-22.04
    steps:
      - name: Accept Dependabot-generated title
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Dependabot-generated title accepted"

      - name: Validate conventional title
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            security
          requireScope: false
          subjectPattern: ^(?![A-Z]).+
          subjectPatternError: |
            The PR title's subject shouldn't start with an uppercase letter.

  check-commit:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate commit subject
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|security)(\([^)]+\))?: [^A-Z].+'; then
            echo "Commit subject is not semantic: $subject" >&2
            exit 1
          fi
