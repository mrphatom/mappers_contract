name: Sync docs to wiki

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/wiki-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Copy wiki source pages
        run: |
          find wiki -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a docs/wiki/. wiki/

      - name: Commit and push wiki
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: sync wiki from docs/wiki" || exit 0
          git push
